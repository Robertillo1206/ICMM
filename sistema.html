<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICMM OS | Desktop</title>
    <link rel="stylesheet" href="sistema.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Fira+Code:wght@400&display=swap"
        rel="stylesheet">
</head>

<body class="os-background">
    <nav class="navbar">
        <div class="nav-logo">ICMM_OS <span class="version">v2.0</span></div>
        <div class="nav-links">
            <a href="index.html">Salir</a>
            <a href="#" class="active">Escritorio</a>
        </div>
    </nav>

    <main class="desktop">
        <div class="icon-grid">
            <div class="shortcut" onclick="window.location.href='terminal.html'">
                <div class="icon-plate">
                    <img src="terminal.png" alt="Terminal">
                </div>
                <span>CMD</span>
            </div>

            <div class="shortcut" onclick="window.location.href='servidores.html'">
                <div class="icon-plate">
                    <img src="servidores.png" alt="servidores">
                </div>
                <span>Servidores</span>
            </div>

            <div class="shortcut" onclick="window.location.href='galeria.html'">
                <div class="icon-plate">
                    <img src="galeria.png" alt="Galeria">
                </div>
                <span>Galeria</span>
            </div>

            <div class="shortcut" onclick="openModal('captura_thunderbird.png')">
                <div class="icon-plate">
                    <img src="thunderbird.png" alt="Thunderbird">
                </div>
                <span>Thunderbird</span>
            </div>

            <div class="shortcut" onclick="openModal('captura_ventoy.png')">
                <div class="icon-plate">
                    <img src="Ventoy.png" alt="Ventoy">
                </div>
                <span>Ventoy</span>
            </div>

            <div class="shortcut" onclick="openModal('captura_talk.png')">
                <div class="icon-plate">
                    <img src="Talk.png" alt="Talk">
                </div>
                <span>Talk</span>
            </div>

            <div class="shortcut" onclick="openModal('captura_glpi.png')">
                <div class="icon-plate">
                    <img src="glpi.png" alt="Glpi">
                </div>
                <span>GLPI</span>
            </div>

            <div class="shortcut" onclick="openModal('captura_hdtune.png')">
                <div class="icon-plate">
                    <img src="hdtune.png" alt="Hd tune">
                </div>
                <span>Hd tune</span>
            </div>

            <div class="shortcut" onclick="openModal('captura_rufus.png')">
                <div class="icon-plate">
                    <img src="rufus.png" alt="Rufus">
                </div>
                <span>Rufus</span>
            </div>

            <div class="shortcut" onclick="openModal('captura_nextcloud.png')">
                <div class="icon-plate">
                    <img src="Nextcloud.png" alt="Nextcloud">
                </div>
                <span>Nextcloud</span>
            </div>

            <div class="shortcut" onclick="openModal('captura_sophos.jpeg')">
                <div class="icon-plate">
                    <img src="sophos.png" alt="Sophos">
                </div>
                <span>Sophos</span>
            </div>

            <div class="shortcut" onclick="openModal('captura_forticlient.png')">
                <div class="icon-plate">
                    <img src="forticlient.jpeg" alt="Forticlient">
                </div>
                <span>Forticlient</span>
            </div>
        </div>
    </main>

    <div id="start-menu" class="start-menu">
        <div class="user-profile">
            <div class="user-avatar">
                <img src="tu_foto.jpg" alt="User"
                    onerror="this.src='https://ui-avatars.com/api/?name=Roberto&background=64ffda&color=0a192f'">
            </div>
            <div class="user-info">
                <span class="user-name">Roberto</span>
                <span class="user-role">TIC ICMM-CSIC</span>
            </div>
        </div>

        <div class="menu-divider"></div>

        <div class="menu-links">
            <div class="menu-item"><span class="icon">📧</span> robertoaperalta06@gmail.com</div>
            <div class="menu-item"><span class="icon">📍</span> Madrid, España</div>
            <div class="menu-item"><span class="icon">💼</span> Estudiante de Prácticas</div>
        </div>

        <div class="menu-footer" onclick="sessionStorage.removeItem('systemLoaded'); window.location.reload();">
            <span class="icon">🔄</span> Reiniciar Sistema
        </div>
    </div>

    <footer class="taskbar-container">
        <div class="taskbar-blur"></div>
        <div class="taskbar-content">
            <div class="start-icon" id="start-button">
                <svg viewBox="0 0 24 24" fill="#64ffda">
                    <path
                        d="M0 0h11.4v11.4H0V0zm12.6 0H24v11.4H12.6V0zM0 12.6h11.4V24H0V12.6zm12.6 0H24V24H12.6V12.6z" />
                </svg>
            </div>
            <div class="active-apps"></div>
            <div class="tray">
                <div class="system-resources">
                    <div class="res-item">
                        <span>CPU</span>
                        <div class="res-bar"><div id="cpu-load" class="res-fill" style="width: 20%"></div></div>
                    </div>
                    <div class="res-item">
                        <span>RAM</span>
                        <div class="res-bar"><div id="ram-load" class="res-fill" style="width: 45%"></div></div>
                    </div>
                </div>
                <div class="time-container">
                    <span class="time" id="clock">00:00:00</span>
                    <span class="date" id="date">--/--/----</span>
                </div>
            </div>
        </div>
    </footer>

    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-modal">&times;</span>
        <div class="modal-container" onclick="event.stopPropagation()">
            <img class="modal-content" id="imgFull">
        </div>
    </div>

    <div id="boot-screen" class="boot-screen">
        <div class="boot-text" id="boot-text"></div>
    </div>
    <div id="notification-container" class="notification-container"></div>

    <script>
        // --- INTERFAZ BÁSICA ---
        const startBtn = document.getElementById('start-button');
        const startMenu = document.getElementById('start-menu');

        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startMenu.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (!startMenu.contains(e.target) && e.target !== startBtn) {
                startMenu.classList.remove('active');
            }
        });

        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const date = now.toLocaleDateString();
            document.getElementById('clock').textContent = time;
            document.getElementById('date').textContent = date;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function openModal(imgSrc) {
            document.getElementById('imgFull').src = imgSrc;
            document.getElementById('imageModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        function updateResources() {
            const cpu = Math.floor(Math.random() * (40 - 10) + 10);
            const ram = Math.floor(Math.random() * (60 - 40) + 40);
            document.getElementById('cpu-load').style.width = cpu + "%";
            document.getElementById('ram-load').style.width = ram + "%";
        }

        // --- SISTEMA DE NOTIFICACIONES ---
        function createNotification() {
            const notifications = [
                { title: "SISTEMA", msg: "Copia de seguridad semanal completada en Rack 2." },
                { title: "SEGURIDAD", msg: "Escaneo de virus finalizado. 0 amenazas detectadas." },
                { title: "RED", msg: "Nueva conexión detectada en el nodo Fibra Principal." },
                { title: "SISTEMA", msg: "Actualización de parches disponible para Forticlient." },
                { title: "HARDWARE", msg: "Temperatura del Rack 1 estable: 22°C." }
            ];
            const container = document.getElementById('notification-container');
            const note = notifications[Math.floor(Math.random() * notifications.length)];
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<div class="toast-header"><span class="toast-title">[ ${note.title} ]</span></div><div class="toast-body">${note.msg}</div>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 500);
            }, 5000);
        }

        // --- SECUENCIA DE BOOT MEJORADA ---
        async function runBootSequence() {
            const container = document.getElementById('boot-text');
            const bootLines = [
                { text: "> INITIALIZING ICMM_OS KERNEL 2.0...", speed: 30 },
                { text: "> LOADING VIRTUAL_DRIVE_C...", speed: 30 },
                { text: "> MOUNTING NETWORK NODES (RACK_A, RACK_B)...", speed: 40 },
                { text: "> VERIFYING FIREWALL STATUS (SOPHOS/FORTI)...", speed: 30 },
                { text: "> STATUS: ALL SYSTEMS OPERATIONAL", speed: 10, class: 'boot-success' },
                { text: "> READY.", speed: 50 }
            ];

            const typeWriter = (text, element, speed) => {
                return new Promise(resolve => {
                    let i = 0;
                    const timer = setInterval(() => {
                        element.textContent += text.charAt(i);
                        i++;
                        if (i === text.length) {
                            clearInterval(timer);
                            resolve();
                        }
                    }, speed);
                });
            };

            for (const lineObj of bootLines) {
                const lineDiv = document.createElement('div');
                lineDiv.className = 'boot-line ' + (lineObj.class || '');
                container.appendChild(lineDiv);
                await typeWriter(lineObj.text, lineDiv, lineObj.speed);
                await new Promise(r => setTimeout(r, Math.random() * 300 + 100));
            }

            setTimeout(() => {
                const screen = document.getElementById('boot-screen');
                screen.style.opacity = '0';
                setTimeout(() => { 
                    screen.style.display = 'none'; 
                    sessionStorage.setItem('systemLoaded', 'true');
                    createNotification();
                }, 500);
            }, 1000);
        }

        window.onload = () => {
            if (sessionStorage.getItem('systemLoaded') === 'true') {
                document.getElementById('boot-screen').style.display = 'none';
                createNotification(); 
            } else {
                runBootSequence();
            }
            setInterval(updateResources, 2000);
        };
    </script>
</body>
</html>
