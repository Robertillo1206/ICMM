<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICMM OS | Servidores</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="servidores.css">
</head>
<body>

    <div class="window-container">
        <div class="os-window-header">
            <div class="terminal-buttons">
                <span class="btn close" onclick="window.location.href='sistema.html'"></span>
                <span class="btn min"></span>
                <span class="btn max"></span>
            </div>
            <div class="os-window-title">Sala_de_servidores.exe</div>
        </div>

        <!-- Raks -->
        <div class="canvas-wrapper">
            <div class="room-canvas">
                <div class="node rack-1" onclick="showRack('RACK 1 (CCC)', 'Rack1.jpeg')">RACK 1</div>
                <div class="node rack-2" onclick="showRack('RACK 2 (CCC)', 'Rack2.jpeg')">RACK 2</div>
                <div class="node fibra"  onclick="showRack('FIBRA', 'fibra.jpg')">FIBRA</div>
                <div class="node rack-b" onclick="showRack('RACK B', 'RackB.jpeg')">RACK B</div>
                <div class="node rack-a" onclick="showRack('RACK A', 'RackA.jpeg')">RACK A</div>
            </div>
        </div>
    </div>

    <div id="modal" class="modal-overlay" onclick="this.style.display='none'">
        <div class="modal-content-wrap" onclick="event.stopPropagation()">
            <h3 id="modal-title"></h3>
            <div class="img-container">
                <img id="modal-img" src="">
            </div>
        </div>
    </div>

    <script>
        function showRack(name, imgSrc) {
            document.getElementById('modal-title').innerText = name;
            document.getElementById('modal-img').src = imgSrc;
            document.getElementById('modal').style.display = 'flex';
        }
    </script>
</body>
</html>
