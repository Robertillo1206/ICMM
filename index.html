<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFG Roberto | Inicio</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-black-index">
    <div class="scanlines"></div>

    <main class="hero-content">
        <div class="status-bar">
            <span class="dot-blink"></span> 
            SYSTEM_ONLINE // ICMM-CSIC
        </div>
        
        <h1 class="hero-title">Prácticas ICMM-CSIC</h1>
        <p class="hero-subtitle">Servicio Informático ICMM-CSIC</p>
        
        <button class="btn-start" onclick="navigateTo('sistema.html')">
            [ COMENZAR_SISTEMA ]
        </button>

        <div id="loader-container">
            <div style="font-size: 0.7rem; color: #64ffda; margin-bottom: 8px; text-align: left; font-family: 'Fira Code';">
                > CARGANDO MÓDULOS DEL SISTEMA... <span id="percent">0%</span>
            </div>
            <div style="width: 100%; height: 4px; background: rgba(100, 255, 218, 0.1); border-radius: 2px; overflow: hidden; border: 1px solid rgba(100, 255, 218, 0.2);">
                <div id="progress-bar" style="width: 0%; height: 100%; background: #64ffda; transition: width 0.15s ease-out; box-shadow: 0 0 10px #64ffda;"></div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
